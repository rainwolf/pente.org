# Global getssl config, installed at /home/debian/letsencrypt/getssl.cfg on the prod host.
# Per-domain settings live in pente.org/getssl.cfg next to it.
# No ACCOUNT_EMAIL here on purpose: this file is tracked and must hold no personal data.

CA="https://acme-v02.api.letsencrypt.org"
ACCOUNT_KEY="/home/debian/letsencrypt/account.key"
PRIVATE_KEY_ALG="rsa"

# ARI (ACME Renewal Information) off: renewal stays on the RENEW_ALLOW window.
ARI_ENABLE="false"
# Renew when 60 days or fewer remain.
RENEW_ALLOW="60"
# Do not poll the remote endpoint to check the served cert.
CHECK_REMOTE="false"
