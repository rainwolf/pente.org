# Domain getssl config, installed at /home/debian/letsencrypt/pente.org/getssl.cfg on the prod host.
# getssl runs on the prod host itself, so ACL entries are local paths (no ssh: prefix).

# Additional names on the certificate (the primary name is pente.org).
SANS="www.pente.org,submanifold.be,othmanw.submanifold.be,pentelive.submanifold.be"

# One ACL entry per name (pente.org plus the 4 SANs): the web root's acme-challenge dir.
ACL=('/home/debian/dockerMain/well-known/acme-challenge'
     '/home/debian/dockerMain/well-known/acme-challenge'
     '/home/debian/dockerMain/well-known/acme-challenge'
     '/home/debian/dockerMain/well-known/acme-challenge'
     '/home/debian/dockerMain/well-known/acme-challenge')

# Where getssl writes the renewed material; build_keystore.sh reads these from the same dir.
DOMAIN_CERT_LOCATION="/home/debian/dockerMain/ssl/pente.org.crt"
DOMAIN_KEY_LOCATION="/home/debian/dockerMain/ssl/pente.org.key"
# Domain cert followed by the CA chain.
DOMAIN_CHAIN_LOCATION="/home/debian/dockerMain/ssl/fullchain.crt"
DOMAIN_KEY_LENGTH=2048

# Runs after a successful renewal: rebuilds keystore.p12 for the container.
RELOAD_CMD="/home/debian/letsencrypt/build_keystore.sh"
